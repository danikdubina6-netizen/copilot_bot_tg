name: Run Copilot AI Bot

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'  # Автоматический перезапуск каждые 5 часов, чтобы обходить лимит GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Чеккаут кода из репозитория
        uses: actions/checkout@v4

      - name: Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка системных зависимостей (FFmpeg для голосовых)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Установка библиотек Python
        run: |
          python -m pip install --upgrade pip
          pip install aiogram openai gTTS beautifulsoup4

      - name: Запуск бота
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAYMENT_TOKEN: ${{ secrets.PAYMENT_TOKEN }}
        run: python bot.py
        
