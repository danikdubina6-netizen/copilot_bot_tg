name: Telegram Bot CI/CD

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '*/15 * * * *'  # Запускает workflow каждые 15 минут, чтобы бот не «спал» на бесплатных раннерах
  workflow_dispatch:        # Позволяет запускать бота вручную из вкладки Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Клонирование репозитория
      uses: actions/checkout@v4

    - name: Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install aiogram requests

    - name: Запуск бота
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
        OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
        OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python bot.py
        
