name: Telegram Bot Runner

on:
  push:
    branches: [ main, master ]
  # Автоматический перезапуск раннера каждые 5 часов
  schedule:
    - cron: '0 */5 * * *'
  # Позволяет запускать воркфлоу вручную со вкладки Actions
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Принудительно гасим задачу через 5 часов 10 минут, чтобы старый раннер не висел вечно
    timeout-minutes: 310
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install aiogram openai
          
      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py
        
