name: Bot Pipeline & CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Запуск каждые 5 часов для поддержания активности
    - cron: "0 */5 * * *"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Прокидываем секреты из настроек репозитория в переменные окружения пайплайна
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Установка системных зависимостей (для Playwright)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-0 libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libnspr4 libpango-1.0-0 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libext6 libfx6 libxi6 libxrandr2 libxrender1 libxss1 libxtst1

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          pip install aiogram aiohttp openai beautifulsoup4 gtts playwright
          playwright install chromium

      - name: Проверка синтаксиса бота
        run: |
          python -m py_compile bot.py

  keep-alive:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: Пинг-пасс по расписанию
        run: echo "Пайплайн успешно отработал по расписанию!"
        
