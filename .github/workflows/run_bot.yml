name: Telegram Bot Runner

on:
  push:
    branches: [ main ]
  # Автоматический перезапуск каждые 5 часов (в 0-ю минуту каждого 5-го часа)
  schedule:
    - cron: '0 */5 * * *'
  # Позволяет перезапускать вручную из вкладки Actions
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Жесткий таймаут на работу джобы (например, 5 часов и 10 минут, после чего GitHub сам принудительно прибьет старый раннер)
    timeout-minutes: 310
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install aiogram openai
          
      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python bot.py
        
