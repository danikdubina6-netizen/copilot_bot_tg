name: Telegram Bot Workflow

# Запускаем воркфлоу по пушу, pull request, а также каждые 5 часов по расписанию
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 */5 * * *' # Запуск каждые 5 часов

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем репозиторий
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Настраиваем Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    # 3. Устанавливаем зависимости
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install aiogram aiohttp openai beautifulsoup4 gtts playwright
        playwright install chromium

    # 4. Проверяем синтаксис и работоспособность кода
    - name: Lint and Test syntax
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        AMMER_PAY_API_TOKEN: ${{ secrets.AMMER_PAY_API_TOKEN }}
      run: |
        python -m py_compile bot.py
        echo "✅ Синтаксис кода в порядке и расписание на 5 часов настроено!"
        
