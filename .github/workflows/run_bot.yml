name: Bot Pipeline & CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Запуск каждые 5 часов для поддержания активности
    - cron: "0 */5 * * *"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Установка зависимостей Python и Playwright
        run: |
          python -m pip install --upgrade pip
          pip install aiogram aiohttp openai beautifulsoup4 gtts playwright
          playwright install chromium
          playwright install-deps

      - name: Проверка синтаксиса бота
        run: |
          python -m py_compile bot.py

  keep-alive:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
      - name: Пинг-пасс по расписанию
        run: echo "Пайплайн успешно отработал по расписанию!"
        
