name: Run Copilot AI Bot

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    # Перезапуск каждые 5 часов (так как у GitHub Actions есть лимит на 6 часов непрерывной работы одного таска)
    - cron: "0 */5 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Установка зависимостей Python и Playwright
        run: |
          python -m pip install --upgrade pip
          pip install aiogram aiohttp openai beautifulsoup4 gtts playwright
          playwright install chromium
          playwright install-deps

      - name: 🚀 ЗАПУСК БОТА (Вечный процесс)
        run: |
          python bot.py
          
